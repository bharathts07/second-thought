<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Second Thought">
  <!--
    The mark is the pause, not a shield and not a lock.

    Security iconography is the first-order reflex for this category and PRODUCT.md
    bans it outright: this product's whole argument is that it is not watching you.
    An ellipsis is the shape of hesitating before you send, which is the product.

    Three dots survive 16px, where anything with an outline, a tail, or interior
    detail turns to mush. Colours are the tokens, not new values: the plum accent and
    the warm paper ground, neither of them pure black or pure white.
  -->
  <rect width="32" height="32" rx="8" fill="oklch(0.52 0.09 320)" />
  <g fill="oklch(0.98 0.004 60)">
    <circle cx="9.5" cy="16" r="2.5" />
    <circle cx="16" cy="16" r="2.5" />
    <circle cx="22.5" cy="16" r="2.5" />
  </g>
</svg>
